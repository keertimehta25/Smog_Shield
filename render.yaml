# Render Blueprint: one web service that serves both the API and the built website.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: smog-shield
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_TIMEOUT_MS
        value: '20000'
      - key: AI_TOTAL_BUDGET_MS
        value: '45000'
      # Paste your key in the Render dashboard when prompted. It is never stored in this file.
      - key: GEMINI_API_KEY
        sync: false
